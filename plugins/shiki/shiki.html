<script type="module">
    import { codeToHtml } from "https://esm.sh/shiki@3.0.0";

    const theme = window.slidesk.env.SHIKI_THEME ?? "min-light";
    for (const code of document.querySelectorAll("pre > code[class*='language-']")) {
        const lang = [...code.classList]
            .find((c) => c.startsWith("language-"))
            .replace("language-", "");
        try {
            // shiki brings its own <pre>: it replaces the block
            code.parentElement.outerHTML = await codeToHtml(code.textContent, { lang, theme });
        } catch {
            // a language shiki does not know (math…) keeps its block
        }
    }
</script>
